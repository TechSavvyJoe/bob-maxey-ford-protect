name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production checks and build site
        run: npm run check

      - name: Add GitHub Pages route entry points
        shell: bash
        run: |
          page_routes=(
            products
            compare
            eligibility
            how-it-works
            resources
          )
          product_routes=(
            premium
            extra
            base
            powertrain
            premium-plus-ev
            premium-ev
            extra-ev
            base-ev
            premium-maintenance
            premium-maintenance-ev
            continued-service
            tirecare
            off-road-coverage
            dentcare
            windshieldcare
            windshieldcare-ev
            triplecare
            surfacecare
            theftcare
            commercial
            incomplete
            medium-duty
          )

          for route in "${page_routes[@]}"; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

          for product in "${product_routes[@]}"; do
            mkdir -p "dist/products/$product"
            cp dist/index.html "dist/products/$product/index.html"
          done

          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
