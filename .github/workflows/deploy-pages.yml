name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production checks and build site
        run: npm run check

      - name: Add GitHub Pages route entry points
        shell: bash
        run: |
          page_routes=(
            products
            compare
            eligibility
            how-it-works
            resources
          )
          product_routes=(
            premium
            extra
            base
            powertrain
            premium-plus-ev
            premium-ev
            extra-ev
            base-ev
            premium-maintenance
            premium-maintenance-ev
            continued-service
            tirecare
            dentcare
            windshieldcare
            windshieldcare-ev
            triplecare
            surfacecare
            theftcare
            commercial
            incomplete
            medium-duty
          )

          for route in "${page_routes[@]}"; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

          for product in "${product_routes[@]}"; do
            mkdir -p "dist/products/$product"
            cp dist/index.html "dist/products/$product/index.html"
          done

          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
